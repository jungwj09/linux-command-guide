{% extends "base.html" %}

{% block content %}

<h2>{{ command.command }}</h2>

<h3>설명</h3>

<p>
    {{ command.description }}
</p>

<h3>사용 예제</h3>

<pre>{{ command.example }}</pre>

{% if session.get('user') %}

<a
    class="button"
    href="{{ url_for('add_favorite', name=command.command) }}"
>
    즐겨찾기 추가
</a>

{% else %}

<p>
    즐겨찾기 기능은 로그인 후 사용할 수 있습니다.
</p>

{% endif %}

{% endblock %}

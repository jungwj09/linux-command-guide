{% extends "base.html" %}

{% block content %}

<h2>Login</h2>

{% if error %}
<p class="error-message">
    {{ error }}
</p>
{% endif %}

<form method="POST">

    <label>아이디</label>
    <input
        type="text"
        name="username"
        required
    >

    <label>비밀번호</label>
    <input
        type="password"
        name="password"
        required
    >

    <button type="submit">
        로그인
    </button>

</form>

{% endblock %}
